name: Build release archives
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release
      - name: Smoke-test Linux bundle independently of development dependencies
        run: |
          mkdir /tmp/tabby-bundle
          tar -xzf dist/releases/tabby-hub-*-linux-x64.tar.gz -C /tmp/tabby-bundle
          /tmp/tabby-bundle/tabby-hub-*-linux-x64/bin/tabby-hub --help
      - uses: actions/upload-artifact@v4
        with:
          name: tabby-hub-release-archives
          path: dist/releases/*
          if-no-files-found: error
